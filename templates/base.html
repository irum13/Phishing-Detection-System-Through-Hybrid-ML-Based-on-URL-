<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}Phishing Detection System{% endblock %}</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='bootstrap.min.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='style.min.css') }}">
    <style>
        body { background: #f7f9fc; color: #172033; }
        .navbar { background: #ffffff; box-shadow: 0 2px 18px rgba(23, 32, 51, 0.08); }
        .shell { max-width: 1080px; margin: 0 auto; padding: 40px 20px; }
        .hero { display: grid; grid-template-columns: 1.15fr 0.85fr; gap: 28px; align-items: center; min-height: 70vh; }
        .panel { background: #ffffff; border: 1px solid #e2e8f0; border-radius: 8px; padding: 28px; box-shadow: 0 12px 30px rgba(23, 32, 51, 0.08); }
        .muted { color: #64748b; }
        .form-control { min-height: 46px; }
        .result-safe { color: #0f766e; }
        .result-risk { color: #b91c1c; }
        .screenshot { width: 100%; border-radius: 8px; border: 1px solid #e2e8f0; }
        @media (max-width: 800px) {
            .hero { grid-template-columns: 1fr; min-height: auto; }
        }
    </style>
</head>
<body>
    <nav id="nav-sticky" class="navbar navbar-expand-lg navbar-light">
        <div class="container">
            <a class="navbar-brand fw-bold" href="{{ url_for('home') }}">Phishing Detection</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#nav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="nav">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item"><a class="nav-link" href="{{ url_for('home') }}">Home</a></li>
                    <li class="nav-item"><a class="nav-link" href="{{ url_for('url') }}">Check URL</a></li>
                    <li class="nav-item"><a class="nav-link" href="{{ url_for('about') }}">About</a></li>
                    <li class="nav-item"><a class="nav-link" href="{{ url_for('notebook') }}">Notebook</a></li>
                    <li class="nav-item"><a class="nav-link" href="{{ url_for('login') }}">Login</a></li>
                </ul>
            </div>
        </div>
    </nav>
    <main class="shell">
        {% block content %}{% endblock %}
    </main>
    <button id="back-to-top" class="btn btn-primary position-fixed bottom-0 end-0 m-3" style="display:none" onclick="topFunction()">Top</button>
    <script src="{{ url_for('static', filename='bootstrap.bundle.min.js') }}"></script>
    <script src="{{ url_for('static', filename='app.js') }}"></script>
</body>
</html>
