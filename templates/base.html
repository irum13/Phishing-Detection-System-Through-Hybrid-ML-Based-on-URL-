<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}Phishing Detection System{% endblock %}</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='bootstrap.min.css') }}">
    <style>
        :root {
            --ink: #102033;
            --muted: #627084;
            --line: #d8e0ea;
            --panel: #ffffff;
            --page: #eef3f8;
            --nav: #0c1826;
            --blue: #2563eb;
            --teal: #0f766e;
            --amber: #b7791f;
            --red: #b42318;
        }

        * { box-sizing: border-box; }
        body {
            margin: 0;
            min-height: 100vh;
            background: var(--page);
            color: var(--ink);
            font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
            letter-spacing: 0;
        }

        a { color: inherit; }
        .topbar {
            background: var(--nav);
            color: #f8fbff;
            border-bottom: 1px solid rgba(255,255,255,0.08);
        }
        .topbar-inner {
            max-width: 1180px;
            min-height: 64px;
            margin: 0 auto;
            padding: 0 22px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 18px;
        }
        .brand {
            display: flex;
            align-items: center;
            gap: 12px;
            text-decoration: none;
            font-weight: 750;
            white-space: nowrap;
        }
        .brand-mark {
            width: 34px;
            height: 34px;
            border-radius: 8px;
            display: grid;
            place-items: center;
            background: #e7f7f4;
            color: var(--teal);
            font-weight: 900;
        }
        .navlinks {
            display: flex;
            align-items: center;
            justify-content: flex-end;
            gap: 6px;
            flex-wrap: wrap;
        }
        .navlinks a {
            color: #d6dee9;
            text-decoration: none;
            padding: 9px 12px;
            border-radius: 8px;
            font-size: 0.95rem;
        }
        .navlinks a:hover,
        .navlinks a:focus {
            background: rgba(255,255,255,0.08);
            color: #ffffff;
        }
        .navlinks .primary-nav {
            background: #f8fbff;
            color: #0c1826;
            font-weight: 700;
        }

        .shell {
            max-width: 1180px;
            margin: 0 auto;
            padding: 34px 22px 56px;
        }
        .hero-grid,
        .split-grid {
            display: grid;
            grid-template-columns: minmax(0, 1.1fr) minmax(330px, 0.9fr);
            gap: 28px;
            align-items: stretch;
        }
        .hero-copy {
            padding: 26px 0;
        }
        .eyebrow {
            color: var(--blue);
            font-size: 0.78rem;
            font-weight: 800;
            letter-spacing: 0.08em;
            text-transform: uppercase;
            margin-bottom: 12px;
        }
        h1, h2, h3 { letter-spacing: 0; }
        .hero-title {
            max-width: 720px;
            font-size: clamp(2.2rem, 5vw, 4.6rem);
            line-height: 0.98;
            font-weight: 850;
            margin: 0 0 18px;
        }
        .hero-text {
            max-width: 660px;
            color: var(--muted);
            font-size: 1.1rem;
            line-height: 1.7;
            margin: 0 0 26px;
        }
        .actions {
            display: flex;
            gap: 12px;
            flex-wrap: wrap;
            align-items: center;
        }
        .btn-app {
            min-height: 46px;
            border-radius: 8px;
            padding: 10px 18px;
            border: 1px solid transparent;
            font-weight: 800;
            text-decoration: none;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }
        .btn-main {
            background: var(--blue);
            color: #ffffff;
        }
        .btn-main:hover { background: #1d4ed8; color: #ffffff; }
        .btn-quiet {
            background: #ffffff;
            color: var(--ink);
            border-color: var(--line);
        }
        .btn-quiet:hover { border-color: #9fb1c7; color: var(--ink); }

        .panel {
            background: var(--panel);
            border: 1px solid var(--line);
            border-radius: 8px;
            box-shadow: 0 18px 45px rgba(16, 32, 51, 0.09);
        }
        .scan-panel { padding: 24px; }
        .section { margin-top: 30px; }
        .section-title {
            font-size: 1.5rem;
            font-weight: 850;
            margin-bottom: 16px;
        }
        .metric-grid,
        .feature-grid {
            display: grid;
            grid-template-columns: repeat(3, minmax(0, 1fr));
            gap: 14px;
        }
        .metric,
        .feature-item {
            background: #ffffff;
            border: 1px solid var(--line);
            border-radius: 8px;
            padding: 18px;
        }
        .metric strong {
            display: block;
            font-size: 1.65rem;
            line-height: 1;
            margin-bottom: 6px;
        }
        .metric span,
        .feature-item span,
        .muted {
            color: var(--muted);
        }
        .feature-item strong {
            display: block;
            margin-bottom: 6px;
        }

        .scan-title {
            font-size: 1.25rem;
            font-weight: 850;
            margin: 0 0 8px;
        }
        .url-input {
            min-height: 54px;
            border: 1px solid #b8c5d4;
            border-radius: 8px;
            padding: 0 15px;
            font-size: 1rem;
        }
        .url-input:focus {
            border-color: var(--blue);
            box-shadow: 0 0 0 4px rgba(37, 99, 235, 0.13);
        }
        .label {
            font-size: 0.82rem;
            color: #334155;
            font-weight: 800;
            margin-bottom: 7px;
        }
        .note-strip {
            display: flex;
            gap: 10px;
            align-items: flex-start;
            padding: 12px 14px;
            border-radius: 8px;
            background: #fff7ed;
            color: #7c2d12;
            border: 1px solid #fed7aa;
            font-size: 0.95rem;
        }
        .status-band {
            padding: 24px;
            border-radius: 8px;
            border: 1px solid var(--line);
            background: #ffffff;
        }
        .status-safe { border-left: 6px solid var(--teal); }
        .status-risk { border-left: 6px solid var(--red); }
        .result-safe { color: var(--teal); }
        .result-risk { color: var(--red); }
        .score-grid {
            display: grid;
            grid-template-columns: repeat(2, minmax(0, 1fr));
            gap: 14px;
            margin-top: 18px;
        }
        .score {
            border: 1px solid var(--line);
            border-radius: 8px;
            padding: 18px;
            background: #f8fafc;
        }
        .score-value {
            font-size: clamp(2rem, 6vw, 3.4rem);
            line-height: 1;
            font-weight: 900;
        }
        .auth-wrap {
            max-width: 720px;
            margin: 0 auto;
        }
        .auth-panel {
            padding: 26px;
        }
        .page-head {
            margin-bottom: 22px;
        }
        .page-head h1 {
            font-size: clamp(2rem, 4vw, 3rem);
            font-weight: 850;
            margin: 0 0 10px;
        }
        .form-control {
            border-radius: 8px;
            min-height: 48px;
        }
        .alert { border-radius: 8px; }
        #back-to-top {
            border-radius: 8px;
        }

        @media (max-width: 900px) {
            .hero-grid,
            .split-grid,
            .metric-grid,
            .feature-grid,
            .score-grid {
                grid-template-columns: 1fr;
            }
            .hero-copy { padding: 8px 0 0; }
            .topbar-inner { align-items: flex-start; flex-direction: column; padding: 14px 18px; }
            .navlinks { justify-content: flex-start; }
        }
    </style>
</head>
<body>
    <header class="topbar">
        <div class="topbar-inner">
            <a class="brand" href="{{ url_for('home') }}">
                <span class="brand-mark">P</span>
                <span>Phishing Detection</span>
            </a>
            <nav class="navlinks" aria-label="Primary navigation">
                <a href="{{ url_for('home') }}">Home</a>
                <a class="primary-nav" href="{{ url_for('url') }}">Check URL</a>
                <a href="{{ url_for('about') }}">About</a>
                <a href="{{ url_for('notebook') }}">Notebook</a>
                <a href="{{ url_for('login') }}">Login</a>
            </nav>
        </div>
    </header>
    <main class="shell">
        {% block content %}{% endblock %}
    </main>
    <button id="back-to-top" class="btn btn-dark position-fixed bottom-0 end-0 m-3" style="display:none" onclick="topFunction()">Top</button>
    <script src="{{ url_for('static', filename='bootstrap.bundle.min.js') }}"></script>
    <script src="{{ url_for('static', filename='app.js') }}"></script>
</body>
</html>
