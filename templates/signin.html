{% extends "base.html" %}
{% block title %}Login - Phishing Detection System{% endblock %}
{% block content %}
<section class="auth-wrap">
    <div class="page-head">
        <div class="eyebrow">Account access</div>
        <h1>Log in to scan URLs.</h1>
    </div>
    <div class="panel auth-panel">
        {% if message %}<div class="alert alert-success">{{ message }}</div>{% endif %}
        {% if error %}<div class="alert alert-danger">{{ error }}</div>{% endif %}
        <form method="post" action="{{ url_for('signin') }}" class="vstack gap-3">
            <div>
                <label class="label" for="user">Username</label>
                <input class="form-control" id="user" name="user" required>
            </div>
            <div>
                <label class="label" for="password">Password</label>
                <input class="form-control" id="password" name="password" type="password" required>
            </div>
            <button class="btn-app btn-main" type="submit">Login</button>
            <a class="text-decoration-none fw-semibold" href="{{ url_for('signup') }}">Create an account</a>
        </form>
    </div>
</section>
{% endblock %}
