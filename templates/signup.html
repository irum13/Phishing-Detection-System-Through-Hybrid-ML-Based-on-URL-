{% extends "base.html" %}
{% block title %}Sign Up - Phishing Detection System{% endblock %}
{% block content %}
<div class="panel" style="max-width: 640px; margin: 0 auto;">
    <h1 class="h3 fw-bold">Create account</h1>
    {% if error %}<div class="alert alert-danger">{{ error }}</div>{% endif %}
    <form method="post" action="{{ url_for('signup') }}" class="row g-3">
        <div class="col-md-6">
            <label class="form-label" for="name">Name</label>
            <input class="form-control" id="name" name="name">
        </div>
        <div class="col-md-6">
            <label class="form-label" for="user">Username</label>
            <input class="form-control" id="user" name="user" required>
        </div>
        <div class="col-md-6">
            <label class="form-label" for="email">Email</label>
            <input class="form-control" id="email" name="email" type="email">
        </div>
        <div class="col-md-6">
            <label class="form-label" for="mobile">Mobile</label>
            <input class="form-control" id="mobile" name="mobile">
        </div>
        <div class="col-12">
            <label class="form-label" for="password">Password</label>
            <input class="form-control" id="password" name="password" type="password" required>
        </div>
        <div class="col-12">
            <button class="btn btn-primary" type="submit">Sign up</button>
            <a class="btn btn-link" href="{{ url_for('login') }}">I already have an account</a>
        </div>
    </form>
</div>
{% endblock %}
