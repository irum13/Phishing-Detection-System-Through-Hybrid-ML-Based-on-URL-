{% extends "base.html" %}
{% block title %}Sign Up - Phishing Detection System{% endblock %}
{% block content %}
<section class="auth-wrap">
    <div class="page-head">
        <div class="eyebrow">Create account</div>
        <h1>Set up access.</h1>
    </div>
    <div class="panel auth-panel">
        {% if error %}<div class="alert alert-danger">{{ error }}</div>{% endif %}
        <form method="post" action="{{ url_for('signup') }}" class="row g-3">
            <div class="col-md-6">
                <label class="label" for="name">Name</label>
                <input class="form-control" id="name" name="name">
            </div>
            <div class="col-md-6">
                <label class="label" for="user">Username</label>
                <input class="form-control" id="user" name="user" required>
            </div>
            <div class="col-md-6">
                <label class="label" for="email">Email</label>
                <input class="form-control" id="email" name="email" type="email">
            </div>
            <div class="col-md-6">
                <label class="label" for="mobile">Mobile</label>
                <input class="form-control" id="mobile" name="mobile">
            </div>
            <div class="col-12">
                <label class="label" for="password">Password</label>
                <input class="form-control" id="password" name="password" type="password" required>
            </div>
            <div class="col-12 actions">
                <button class="btn-app btn-main" type="submit">Sign up</button>
                <a class="btn-app btn-quiet" href="{{ url_for('login') }}">I already have an account</a>
            </div>
        </form>
    </div>
</section>
{% endblock %}
